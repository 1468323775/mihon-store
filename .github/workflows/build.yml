name: Build extensions & Mihon store

# 1) 矩阵编译各扩展模块（release 签名，证书指纹 = 商店 signingKey）
# 2) 生成 Mihon「新式商店」索引 index.json + apk/ + icon/（支持多个扩展）
# 3) 商店发布由仓库变量 STORE_PUBLISH=true 控制（默认只出产物、不发布）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'index.json'
      - 'apk/**'
      - 'icon/**'

permissions:
  contents: read

env:
  UPSTREAM_REPO: keiyoushi/extensions-source
  UPSTREAM_COMMIT: 42176662d3d29926371ec5a8d7e06e2b194f1df8
  STORE_NAME: 琳的扩展仓库
  STORE_BADGE: 琳
  STORE_WEBSITE: https://github.com/1468323775/mihon-store
  STORE_BASE_URL: https://raw.githubusercontent.com/1468323775/mihon-store/main
  EXPECTED_FINGERPRINT: e93c713252287646464de377f1e6b65803724e8d0991aa19c12fe45c72e02697

jobs:
  build:
    name: Build ${{ matrix.key }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: dogemanga
            module: src/zh/dogemanga
            gradle_path: ':src:zh:dogemanga'
          - key: copymanga
            module: src/zh/copymanga
            gradle_path: ':src:zh:copymanga'

    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ours
          persist-credentials: false

      - name: Checkout keiyoushi/extensions-source (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Inject our source module
        run: |
          rm -rf "upstream/${{ matrix.module }}"
          cp -r "ours/${{ matrix.module }}" "upstream/${{ matrix.module }}"
          find "upstream/${{ matrix.module }}" -type f | sort

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > upstream/signingkey.jks
          ls -l upstream/signingkey.jks
          keytool -list -v -keystore upstream/signingkey.jks -storetype pkcs12 \
            -storepass "$KEY_STORE_PASSWORD" | grep -Ei 'alias|SHA256|valid|别名|有效期' || true

      - name: Apply ktlint formatting (self-healing)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew "${{ matrix.gradle_path }}:spotlessApply" --no-daemon

      - name: Assemble release APK (signed)
        working-directory: upstream
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew "${{ matrix.gradle_path }}:assembleRelease" --no-daemon --stacktrace

      - name: Show source info
        run: |
          INFO="upstream/${{ matrix.module }}/build/keiyoushi-source-info.json"
          ls -l "$INFO"
          cat "$INFO"

      - name: Verify APK signature against store signing key
        run: |
          APK=$(find "upstream/${{ matrix.module }}/build/outputs/apk/release" -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          FP=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK 证书 SHA-256: $FP"
          echo "商店 signingKey : $EXPECTED_FINGERPRINT"
          if [ "$FP" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::指纹不匹配，商店装不上或信任会失败"
            exit 1
          fi
          echo "✅ 签名指纹与商店 signingKey 一致"

      - name: Verify source payload survived R8 shrinking
        run: |
          APK=$(find "upstream/${{ matrix.module }}/build/outputs/apk/release" -name '*.apk' | head -1)
          python3 ours/tools/check_r8.py \
            "$APK" \
            "upstream/${{ matrix.module }}/build/keiyoushi-source-info.json" \
            "${{ matrix.module }}"

      - name: Upload module bundle (apk + source-info + icon)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ext-${{ matrix.key }}
          path: |
            upstream/${{ matrix.module }}/build/outputs/apk/release/*.apk
            upstream/${{ matrix.module }}/build/keiyoushi-source-info.json
            upstream/${{ matrix.module }}/res/mipmap-xhdpi/ic_launcher.png
          if-no-files-found: error

  publish:
    name: Publish store files
    needs: build
    if: ${{ vars.STORE_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all module bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Build store index (multi-extension)
        run: |
          python3 tools/build_store.py \
            --artifacts artifacts \
            --out store \
            --base-url "$STORE_BASE_URL" \
            --name "$STORE_NAME" --badge "$STORE_BADGE" --website "$STORE_WEBSITE" \
            --signing-key "$EXPECTED_FINGERPRINT"
          echo "--- store 目录 ---"
          find store -type f | sort
          (cd store && sha256sum apk/*.apk)

      - name: Commit store files
        run: |
          cp store/index.json ./index.json
          mkdir -p apk icon
          cp store/apk/* apk/
          cp store/icon/* icon/
          # 只保留本轮发布的那几个包，旧版本清掉
          NEW=$(cd store/apk && ls *.apk)
          for f in apk/*.apk; do
            base=$(basename "$f")
            if ! printf '%s\n' "$NEW" | grep -qx "$base"; then
              echo "清理旧包: $base"
              rm -f "$f"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json apk icon
          if git diff --cached --quiet; then
            echo "商店文件无变化"
          else
            git commit -m "Publish store index"
            git push
          fi

      # 光看「任务绿」不算数：.gitignore 吃过 apk 一次，索引指向 404 但 CI 全绿。
      - name: Verify published store is complete and publicly reachable
        run: |
          echo "--- 仓库里真实跟踪的商店文件 ---"
          git ls-files index.json apk icon
          test -n "$(git ls-files 'apk/*.apk')" || { echo "::error::apk 没进仓库（多半被 .gitignore 吃了）"; exit 1; }
          test -n "$(git ls-files 'icon/*.png')" || { echo "::error::icon 没进仓库"; exit 1; }

          python3 - <<'PY'
          import hashlib, io, json, subprocess, time, urllib.request, zipfile

          index_url = "https://raw.githubusercontent.com/1468323775/mihon-store/main/index.json"

          def get(url, tries=10, delay=20):
              last = None
              for _ in range(tries):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return r.status, r.read()
                  except Exception as e:  # 刚 push 完 CDN 可能还没刷出来
                      last = e
                      time.sleep(delay)
              raise SystemExit(f"拉不到 {url}: {last}")

          tracked = subprocess.run(["git", "ls-files", "apk", "icon"], capture_output=True, text=True).stdout.split()
          status, body = get(index_url)
          store = json.loads(body)
          exts = store["extensionList"]["extensions"]
          print(f"线上商店索引 {status} | {store['name']} | 签名 {store['signingKey'][:16]}… | {len(exts)} 个扩展")

          referenced = set()
          for e in exts:
              apk_url, icon_url = e["resources"]["apkUrl"], e["resources"]["iconUrl"]
              apk_rel = "/".join(apk_url.split("/")[-2:])
              icon_rel = "/".join(icon_url.split("/")[-2:])
              print(f"\n▶ {e['name']} {e['versionName']} ({e['versionCode']}) {e['contentWarning']} 源={[s['name'] for s in e['sources']]}")
              assert apk_rel in tracked, f"索引里的 {apk_rel} 不在仓库里"
              assert icon_rel in tracked, f"索引里的 {icon_rel} 不在仓库里"
              referenced |= {apk_rel, icon_rel}
              for label, url in (("apk", apk_url), ("icon", icon_url)):
                  st, data = get(url, tries=6, delay=15)
                  print(f"   匿名下载 {label}: http={st} size={len(data)}")
                  assert st == 200 and len(data) > 0, f"{label} 匿名拉不回来"
              st, apk_bytes = get(apk_url, tries=3, delay=10)
              print(f"   线上 apk sha256={hashlib.sha256(apk_bytes).hexdigest()[:16]}… 包内={sorted(n for n in zipfile.ZipFile(io.BytesIO(apk_bytes)).namelist() if n.endswith('.dex'))}")

          orphans = set(tracked) - referenced
          assert not orphans, f"仓库里有多余文件没被索引引用: {orphans}"
          print("\n✅ 商店线上可拉，索引与仓库文件一一对应，无多余残留")
          PY
