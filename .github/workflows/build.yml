name: Build dogemanga extension

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ours
          persist-credentials: false

      - name: Checkout keiyoushi/extensions-source (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keiyoushi/extensions-source
          ref: 42176662d3d29926371ec5a8d7e06e2b194f1df8
          path: upstream
          persist-credentials: false

      - name: Inject our source module
        run: |
          rm -rf upstream/src/zh/dogemanga
          cp -r ours/src/zh/dogemanga upstream/src/zh/dogemanga
          find upstream/src/zh/dogemanga -type f | sort

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Apply ktlint formatting (self-healing)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :src:zh:dogemanga:spotlessApply --no-daemon

      - name: Assemble debug APK
        working-directory: upstream
        run: |
          ./gradlew :src:zh:dogemanga:assembleDebug --no-daemon --stacktrace

      - name: Show outputs
        run: find upstream/src/zh/dogemanga/build/outputs -type f | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dogemanga-debug-apk
          path: upstream/src/zh/dogemanga/build/outputs/apk/debug/*.apk
          if-no-files-found: error
