name: Build extension & Mihon store

# 1) 编译 dogemanga 扩展（release 签名，证书指纹 = 商店 signingKey）
# 2) 生成 Mihon「新式商店」索引 index.json + apk/ + icon/
# 3) 商店发布由仓库变量 STORE_PUBLISH=true 控制（默认只出产物、不发布）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'index.json'
      - 'apk/**'
      - 'icon/**'

permissions:
  contents: read

env:
  UPSTREAM_REPO: keiyoushi/extensions-source
  UPSTREAM_COMMIT: 42176662d3d29926371ec5a8d7e06e2b194f1df8
  MODULE_DIR: src/zh/dogemanga
  GRADLE_PATH: ':src:zh:dogemanga'
  STORE_NAME: 琳的扩展仓库
  STORE_BADGE: 琳
  STORE_WEBSITE: https://github.com/1468323775/mihon-store
  STORE_BASE_URL: https://raw.githubusercontent.com/1468323775/mihon-store/main
  EXPECTED_FINGERPRINT: e93c713252287646464de377f1e6b65803724e8d0991aa19c12fe45c72e02697

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ours
          persist-credentials: false

      - name: Checkout keiyoushi/extensions-source (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          persist-credentials: false

      - name: Inject our source module
        run: |
          rm -rf "upstream/$MODULE_DIR"
          cp -r "ours/$MODULE_DIR" "upstream/$MODULE_DIR"
          find "upstream/$MODULE_DIR" -type f | sort

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > upstream/signingkey.jks
          ls -l upstream/signingkey.jks
          keytool -list -v -keystore upstream/signingkey.jks -storetype pkcs12 \
            -storepass "$KEY_STORE_PASSWORD" | grep -Ei 'alias|SHA256|valid|别名|有效期' || true

      - name: Apply ktlint formatting (self-healing)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew "$GRADLE_PATH:spotlessApply" --no-daemon

      - name: Assemble release APK (signed)
        working-directory: upstream
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew "$GRADLE_PATH:assembleRelease" --no-daemon --stacktrace

      - name: Show source info
        run: |
          INFO="upstream/$MODULE_DIR/build/keiyoushi-source-info.json"
          ls -l "$INFO"
          cat "$INFO"

      - name: Verify APK signature against store signing key
        run: |
          APK=$(find "upstream/$MODULE_DIR/build/outputs/apk/release" -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs "$APK"
          FP=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK 证书 SHA-256: $FP"
          echo "商店 signingKey : $EXPECTED_FINGERPRINT"
          if [ "$FP" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::指纹不匹配，商店装不上或信任会失败"
            exit 1
          fi
          echo "✅ 签名指纹与商店 signingKey 一致"

      - name: Verify source payload survived R8 shrinking
        run: |
          APK=$(find "upstream/$MODULE_DIR/build/outputs/apk/release" -name '*.apk' | head -1)
          python3 - "$APK" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          blob = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
          markers = {
              "源名 漫画狗": "漫画狗".encode(),
              "站点 baseUrl": b"https://dogemanga.com",
              "翻页接口 /_search": b"/_search",
              "JSON 字段 manga_cards": b"manga_cards",
              "kotlinx.serialization": b"kotlinx/serialization/json/Json",
              "章节列表选择器": b"a.site-manga-thumbnail__link",
              "阅读器选择器": b"img.site-reader__image",
              "图片地址属性": b"data-page-image-url",
              "连载状态关键字": "連載中".encode(),
          }
          bad = []
          for label, needle in markers.items():
              ok = needle in blob
              print(("  ✅ " if ok else "  ❌ ") + label)
              if not ok:
                  bad.append(label)
          if bad:
              sys.exit("R8 把关键串干掉了: " + ", ".join(bad))
          PY

      - name: Build store bundle
        run: |
          APK=$(find "upstream/$MODULE_DIR/build/outputs/apk/release" -name '*.apk' | head -1)
          python3 ours/tools/build_store.py \
            --info "upstream/$MODULE_DIR/build/keiyoushi-source-info.json" \
            --apk "$APK" \
            --icon "upstream/$MODULE_DIR/res/mipmap-xhdpi/ic_launcher.png" \
            --out store \
            --base-url "$STORE_BASE_URL" \
            --name "$STORE_NAME" --badge "$STORE_BADGE" --website "$STORE_WEBSITE" \
            --signing-key "$EXPECTED_FINGERPRINT"
          echo "--- store 目录 ---"
          find store -type f | sort
          (cd store && sha256sum apk/*.apk)

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: upstream/${{ env.MODULE_DIR }}/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload store bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-bundle
          path: store/**
          if-no-files-found: error

  publish:
    name: Publish store files
    needs: build
    if: ${{ vars.STORE_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download store bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-bundle
          path: store

      - name: Commit store files
        run: |
          cp store/index.json ./index.json
          mkdir -p apk icon
          cp store/apk/* apk/
          cp store/icon/* icon/
          # 只留当前版本的包，别让仓库里堆历史 APK
          NEW_APK=$(basename "$(ls store/apk/*.apk | head -1)")
          find apk -maxdepth 1 -name '*.apk' ! -name "$NEW_APK" -print -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json apk icon
          if git diff --cached --quiet; then
            echo "商店文件无变化"
          else
            git commit -m "Publish store index"
            git push
          fi

      # 光看「任务绿」不算数：.gitignore 吃过 apk 一次，索引指向 404 但 CI 全绿。
      - name: Verify published store is complete and publicly reachable
        run: |
          echo "--- 仓库里真实跟踪的商店文件 ---"
          git ls-files index.json apk icon
          APK=$(git ls-files 'apk/*.apk')
          ICON=$(git ls-files 'icon/*.png')
          [ -n "$APK" ] || { echo "::error::apk 没进仓库（多半被 .gitignore 吃了）"; exit 1; }
          [ -n "$ICON" ] || { echo "::error::icon 没进仓库"; exit 1; }

          python3 - "$APK" "$ICON" <<'PY'
          import json, sys, urllib.request, time
          apk_rel, icon_rel = sys.argv[1], sys.argv[2]
          index_url = "https://raw.githubusercontent.com/1468323775/mihon-store/main/index.json"

          def get(url, tries=10, delay=20):
              last = None
              for i in range(tries):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return r.status, r.read()
                  except Exception as e:  # 刚 push 完 CDN 可能还没刷出来
                      last = e
                      time.sleep(delay)
              raise SystemExit(f"拉不到 {url}: {last}")

          status, body = get(index_url)
          store = json.loads(body)
          ext = store["extensionList"]["extensions"][0]
          apk_url = ext["resources"]["apkUrl"]
          icon_url = ext["resources"]["iconUrl"]
          print(f"商店索引 {status} | {store['name']} | 签名 {store['signingKey'][:16]}…")
          print(f"扩展 {ext['name']} {ext['versionName']} ({ext['versionCode']}) {ext['contentWarning']}")

          assert apk_url.endswith(apk_rel), f"索引里的 apkUrl 与仓库文件对不上: {apk_url} vs {apk_rel}"
          assert icon_url.endswith(icon_rel), f"索引里的 iconUrl 与仓库文件对不上: {icon_url} vs {icon_rel}"

          for label, url in (("apk", apk_url), ("icon", icon_url)):
              st, data = get(url, tries=6, delay=15)
              print(f"  匿名下载 {label}: http={st} size={len(data)}")
              assert st == 200 and len(data) > 0, f"{label} 匿名拉不回来"

          st, apk_bytes = get(apk_url, tries=3, delay=10)
          import hashlib, zipfile, io
          h = hashlib.sha256(apk_bytes).hexdigest()
          print(f"  线上 apk sha256: {h}")
          z = zipfile.ZipFile(io.BytesIO(apk_bytes))
          names = z.namelist()
          print(f"  包内结构: {sorted(n for n in names if n.endswith('.dex') or n == 'AndroidManifest.xml')}")
          print("✅ 商店线上可拉、apk/icon 齐全、索引与文件对得上")
          PY
